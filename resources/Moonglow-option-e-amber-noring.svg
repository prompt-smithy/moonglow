    <circle cx="510" cy="625" r="16" fill="#0d0d11" opacity="0.75"/>
    <circle cx="509" cy="624" r="12" fill="#2c2c38" opacity="0.6"/>
    <!-- Kepler -->
    <circle cx="395" cy="465" r="10" fill="#0d0d11" opacity="0.7"/>
    <circle cx="394" cy="464" r="7" fill="#2b2b36" opacity="0.5"/>
