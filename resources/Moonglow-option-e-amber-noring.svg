<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <clipPath id="moon-disc">
      <circle cx="512" cy="512" r="215"/>
    </clipPath>
    <radialGradient id="lunar-depth" cx="42%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#2a2a34"/>
      <stop offset="60%" stop-color="#18181c"/>
      <stop offset="100%" stop-color="#0f0f13"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" rx="245.760" fill="#ffb300"/>
