name: macOS

on:
  push:
    branches: [main]
    paths:
      - 'apps/macos/**'
      - 'resources/**'
      - 'spec/**'
      - 'VERSION'
      - 'tools/build-release.py'
      - 'tools/package-linux.py'
      - '.github/workflows/macos.yml'
  pull_request:
    paths:
      - 'apps/macos/**'
      - 'resources/**'
      - 'spec/**'
      - 'VERSION'
      - 'tools/build-release.py'
      - 'tools/package-linux.py'
      - '.github/workflows/macos.yml'

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/macos
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: apps/macos/.build
          key: ${{ runner.os }}-swift-${{ hashFiles('apps/macos/Package.swift', 'apps/macos/Package.resolved') }}
          restore-keys: ${{ runner.os }}-swift-

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Build and test sandbox prototype
        env:
          MOONGLOW_APP_SANDBOXED: '1'
        run: |
          swift build --scratch-path .build-sandbox
          swift test --scratch-path .build-sandbox

      - name: Check the sandboxed release binary
        env:
          MOONGLOW_APP_SANDBOXED: '1'
        run: |
          swift build --configuration release --scratch-path .build-sandbox
          binary="$(swift build --configuration release --scratch-path .build-sandbox --show-bin-path)/Moonglow"
          binary_details="$RUNNER_TEMP/moonglow-sandbox-binary.txt"
          otool -L "$binary" > "$binary_details"
          strings -a "$binary" >> "$binary_details"
          if grep -E 'IOAVService|DCPAVServiceProxy|IOFramebuffer|CoreDisplay\.framework|IOKit\.framework|--sandbox-gamma-probe|Homebrew Hardware Build|Open Source Code' "$binary_details"; then
            echo "error: hardware APIs, the debug probe, or distribution links found in the sandboxed release" >&2
            exit 1
          fi

      - name: Lint packaging scripts and Info.plist
        run: |
          for script in Packaging/*.sh; do bash -n "$script"; done
          plutil -lint Packaging/Info.plist Packaging/AppStoreSandbox.entitlements
