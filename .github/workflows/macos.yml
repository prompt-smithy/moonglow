name: macOS

on:
  push:
    branches: [main]
    paths:
      - 'apps/macos/**'
      - 'resources/**'
      - 'spec/**'
      - '.github/workflows/macos.yml'
  pull_request:
    paths:
      - 'apps/macos/**'
      - 'resources/**'
      - 'spec/**'
      - '.github/workflows/macos.yml'

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/macos
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: apps/macos/.build
          key: ${{ runner.os }}-swift-${{ hashFiles('apps/macos/Package.swift', 'apps/macos/Package.resolved') }}
          restore-keys: ${{ runner.os }}-swift-

      - name: Build
        run: swift build

      - name: Test
        run: swift test
