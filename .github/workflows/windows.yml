name: Windows

on:
  push:
    branches: [main]
    paths:
      - 'apps/windows/**'
      - 'resources/**'
      - 'spec/**'
      - 'VERSION'
      - 'tools/build-release.py'
      - 'tools/package-linux.py'
      - '.github/workflows/windows.yml'
  pull_request:
    paths:
      - 'apps/windows/**'
      - 'resources/**'
      - 'spec/**'
      - 'VERSION'
      - 'tools/build-release.py'
      - 'tools/package-linux.py'
      - '.github/workflows/windows.yml'

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/windows
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('apps/windows/**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Build
        run: dotnet build Moonglow.csproj -c Release

      # Loads spec/vectors and asserts the shared contract; see spec/README.md.
      - name: Test
        run: dotnet test Moonglow.Core.Tests/Moonglow.Core.Tests.csproj -c Release

      - name: Test display worker and settings persistence
        run: dotnet test Moonglow.Platform.Tests/Moonglow.Platform.Tests.csproj -c Release

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: moonglow-windows
          path: apps/windows/bin/Release/
          if-no-files-found: warn
