name: Linux

on:
  push:
    branches: [main]
    paths:
      - 'apps/linux/**'
      - 'resources/**'
      - 'spec/**'
      - 'VERSION'
      - 'tools/build-release.py'
      - 'tools/package-linux.py'
      - '.github/workflows/linux.yml'
  pull_request:
    paths:
      - 'apps/linux/**'
      - 'resources/**'
      - 'spec/**'
      - 'VERSION'
      - 'tools/build-release.py'
      - 'tools/package-linux.py'
      - '.github/workflows/linux.yml'

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/linux
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/linux/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('apps/linux/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # Build the native GTK4/libadwaita app as well as the portable core.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libgtk-4-dev libadwaita-1-dev xvfb dbus-x11 \
            libxkbcommon-dev libwayland-dev \
            libx11-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev \
            libgl1-mesa-dev

      - name: Test
        run: cargo test --workspace

      - name: Test native GTK controls
        env:
          GTK_A11Y: none
        run: xvfb-run -a dbus-run-session cargo test -p moonglow native_search_back_navigation_and_compact_css -- --ignored

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Format
        run: cargo fmt --all --check
